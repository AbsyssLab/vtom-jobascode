# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/workflows/**'
      - '.github/scripts/**'

  # Allows you to run this workflow manually from the Actions tab
  # workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v6

        with:
            fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Import changes to VTOM
        env:
          VTOM_SERVER_NAME: ${{ vars.VTOM_SERVER_NAME }}
          VTOM_TOKEN: ${{ secrets.VTOM_TOKEN }}
          VTOM_DOMAIN_API_VERSION: "5.0"
          VTOM_VERIFY_SSL: "false"
        run: |
          python3 .github/scripts/importAsCode.py \
            --from "${{ github.event.before }}" \
            --to "${{ github.event.after }}" \
            --repo-root "${{ github.workspace }}" --run
